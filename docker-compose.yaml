version: '3.8'

services:
  postgres:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.0-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  liquibase:
    image: liquibase/liquibase
    depends_on:
      - postgres
    volumes:
      - ./migrations/liquibase:/liquibase/changelog
    command: >
      sh -c "liquibase --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB} --username=${LIQUIBASE_USERNAME} --password=${LIQUIBASE_PASSWORD} --changeLogFile=changelog/changelog.sql clearCheckSums &&
             liquibase --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB} --username=${LIQUIBASE_USERNAME} --password=${LIQUIBASE_PASSWORD} --changeLogFile=changelog/changelog.sql update"

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092 # на каких портах прослушиваем входящие подключения
      # [протокол]://[адрес]:[порт]
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092 # какие адреса, порты будут возвращены клиенту
      # при установке соединения
      KAFKA_BROKER_ID: 1 # идентификатор для брокера в кластере
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181 # адрес и порт zookeeper
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  redisdata:
  pgdata:
