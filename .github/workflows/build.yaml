name: Build

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: temurin
          cache: maven
          
      - name: Maven verify
        working-directory: java-Shumer-1
        run: mvn verify --batch-mode

      - id: jacoco
        if: github.event_name != 'workflow_dispatch'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/java-Shumer-1/report/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 30
          min-coverage-changed-files: 30
          title: Code Coverage
          update-comment: true

  linter:
    name: linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: temurin
          cache: maven

      - name: Maven lint (spotless, spotbugs, pmd…)
        working-directory: java-Shumer-1
        run: mvn compile -am \
            spotless:check \
            modernizer:modernizer \
            spotbugs:check \
            pmd:check \
            pmd:cpd-check
