name: Scrapper Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/scrapper.yml
      - scrapper/**
      - link-parser/**

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/scrapper

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven package
        run: mvn -f scrapper/pom.xml clean package

      - id: jacoco
        uses: madrapps/jacoco-report@v1.6.1
        if: github.event_name != 'workflow_dispatch'
        with:
          paths: scrapper/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 30
          min-coverage-changed-files: 30
          title: Code Coverage
          update-comment: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: scrapper.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SO_TOKEN_KEY=${{ secrets.SO_TOKEN_KEY }}
